name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download Forge MDK 1.12.2
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
      - name: Insert mod sources
        run: |
          rm -rf mdk/src
          cp -r src mdk/src
          cp build.gradle mdk/build.gradle
          sed -i 's/14\.23\.5\.2860/14.23.5.2847/' mdk/build.gradle
          grep -n "version" mdk/build.gradle
      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: concertmod-jar
          path: mdk/build/libs/*.jar
